<style>
:root{
  --ed-bg:#f4f5f7;--ed-surf:#fff;--ed-bdr:#e1e4e8;--ed-primary:#1a73e8;
  --ed-primary-lt:#e8f0fe;--ed-text:#1f2937;--ed-muted:#6b7280;
  --ed-canvas-bg:#e9ecef;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;overflow:hidden;font-family:Inter,sans-serif;background:var(--ed-bg);}
.ed-topbar{height:52px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--ed-bdr);background:var(--ed-surf);flex-shrink:0;position:sticky;top:0;z-index:200;}
.ed-topbar-back{font-size:13px;color:var(--ed-muted);text-decoration:none;white-space:nowrap;display:flex;align-items:center;gap:4px;}
.ed-topbar-back:hover{color:var(--ed-primary);}
.ed-topbar-title{font-size:15px;font-weight:700;color:var(--ed-text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ed-topbar-actions{display:flex;gap:8px;align-items:center;flex-shrink:0;}
.ed-btn{padding:7px 14px;border-radius:8px;border:none;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;outline:none;display:inline-flex;align-items:center;gap:5px;}
.ed-btn-primary{background:var(--ed-primary);color:#fff;}.ed-btn-primary:hover{opacity:.9;}
.ed-btn-ghost{background:transparent;color:var(--ed-muted);padding:6px 10px;}.ed-btn-ghost:hover{color:var(--ed-primary);background:var(--ed-primary-lt);}
.ed-btn-outlined{background:transparent;border:1px solid var(--ed-bdr);color:var(--ed-text);}.ed-btn-outlined:hover{border-color:var(--ed-primary);color:var(--ed-primary);}
.ed-btn-danger{background:#ef4444;color:#fff;}.ed-btn-sm{padding:5px 10px;font-size:11px;}
.ed-mode-tabs{display:flex;gap:0;background:var(--ed-surf);border-bottom:1px solid var(--ed-bdr);padding:0 16px;flex-shrink:0;}
.ed-mode-tab{padding:10px 18px;font-size:13px;font-weight:500;color:var(--ed-muted);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;}
.ed-mode-tab:hover{color:var(--ed-primary);}.ed-mode-tab.active{color:var(--ed-primary);border-bottom-color:var(--ed-primary);font-weight:600;}
.ed-app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;}
.ed-body{display:flex;flex:1;overflow:hidden;min-height:0;}
.ed-sidebar{width:300px;min-width:240px;display:flex;flex-direction:column;border-right:1px solid var(--ed-bdr);background:var(--ed-surf);overflow:hidden;flex-shrink:0;}
.ed-sidebar-header{padding:12px 14px;border-bottom:1px solid var(--ed-bdr);font-size:12px;font-weight:700;color:var(--ed-text);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;justify-content:space-between;}
.ed-sidebar-body{flex:1;overflow-y:auto;padding:0;}
.ed-section{border-bottom:1px solid var(--ed-bdr);}
.ed-section-head{padding:10px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:12px;font-weight:600;color:var(--ed-text);}
.ed-section-head:hover{background:var(--ed-primary-lt);}
.ed-section-head .ed-chevron{transition:transform .2s;font-size:10px;margin-left:auto;color:var(--ed-muted);}
.ed-section-head.collapsed .ed-chevron{transform:rotate(-90deg);}
.ed-section-body{padding:8px 14px 12px;display:block;}
.ed-section-head.collapsed + .ed-section-body{display:none;}
.ed-field{margin-bottom:10px;}
.ed-label{display:block;font-size:11px;font-weight:600;color:var(--ed-muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em;}
.ed-input{width:100%;padding:7px 10px;border:1px solid var(--ed-bdr);border-radius:6px;font-size:13px;outline:none;background:#fff;transition:border-color .12s;font-family:inherit;}
.ed-input:focus{border-color:var(--ed-primary);}
.ed-select{width:100%;padding:7px 10px;border:1px solid var(--ed-bdr);border-radius:6px;font-size:13px;outline:none;background:#fff;cursor:pointer;font-family:inherit;}
.ed-textarea{width:100%;padding:7px 10px;border:1px solid var(--ed-bdr);border-radius:6px;font-size:12px;outline:none;resize:vertical;font-family:inherit;min-height:60px;}
.ed-row{display:flex;gap:8px;}.ed-row > *{flex:1;min-width:0;}
.ed-color-wrap{display:flex;align-items:center;gap:6px;}
.ed-color-swatch{width:30px;height:30px;border-radius:6px;border:1px solid var(--ed-bdr);cursor:pointer;padding:0;overflow:hidden;}
.ed-color-swatch input[type=color]{width:40px;height:40px;border:none;padding:0;cursor:pointer;margin:-5px;}
.ed-check-row{display:flex;align-items:center;gap:8px;padding:4px 0;}
.ed-check-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--ed-primary);}
.ed-check-row label{font-size:12px;color:var(--ed-text);cursor:pointer;}
.ed-elem-list{list-style:none;margin:0;padding:0;}
.ed-elem-item{padding:7px 10px;font-size:12px;cursor:pointer;border-radius:6px;display:flex;align-items:center;gap:8px;transition:all .12s;user-select:none;margin-bottom:2px;}
.ed-elem-item:hover{background:var(--ed-primary-lt);}
.ed-elem-item.active{background:var(--ed-primary);color:#fff;}
.ed-elem-item .ed-elem-icon{font-size:14px;flex-shrink:0;}
.ed-elem-item .ed-elem-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ed-elem-item .ed-elem-vis{cursor:pointer;font-size:11px;opacity:.5;}.ed-elem-item .ed-elem-vis:hover{opacity:1;}
.ed-add-btn{width:100%;padding:8px;border:1.5px dashed var(--ed-bdr);border-radius:8px;background:transparent;font-size:12px;font-weight:600;color:var(--ed-muted);cursor:pointer;transition:all .15s;margin-top:6px;}
.ed-add-btn:hover{border-color:var(--ed-primary);color:var(--ed-primary);background:var(--ed-primary-lt);}
.ed-canvas-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--ed-canvas-bg);overflow:auto;padding:24px;min-width:0;}
.ed-canvas-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-shrink:0;}
.ed-zoom-btn{background:var(--ed-surf);border:1px solid var(--ed-bdr);border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;font-weight:600;color:var(--ed-text);}
.ed-zoom-btn:hover{border-color:var(--ed-primary);color:var(--ed-primary);}
.ed-canvas{position:relative;background:#fff;border:1px solid var(--ed-bdr);box-shadow:0 4px 24px rgba(0,0,0,.08);border-radius:4px;overflow:hidden;transition:width .2s,height .2s;}
.ed-el{position:absolute;cursor:move;user-select:none;outline:2px solid transparent;outline-offset:2px;transition:outline-color .1s;min-width:20px;min-height:14px;}
.ed-el:hover{outline-color:rgba(26,115,232,.3);}
.ed-el.selected{outline-color:var(--ed-primary);outline-style:solid;z-index:10;}
.ed-el.selected::after{content:'';position:absolute;inset:-4px;border:1.5px dashed var(--ed-primary);border-radius:2px;pointer-events:none;}
.ed-resize{position:absolute;bottom:-4px;right:-4px;width:10px;height:10px;background:var(--ed-primary);border-radius:2px;cursor:se-resize;display:none;}
.ed-el.selected .ed-resize{display:block;}
.ed-props{width:260px;min-width:220px;display:flex;flex-direction:column;border-left:1px solid var(--ed-bdr);background:var(--ed-surf);overflow:hidden;flex-shrink:0;}
.ed-props-header{padding:12px 14px;border-bottom:1px solid var(--ed-bdr);font-size:12px;font-weight:700;color:var(--ed-text);text-transform:uppercase;letter-spacing:.05em;}
.ed-props-body{flex:1;overflow-y:auto;padding:12px 14px;}
.ed-props-empty{padding:40px 14px;text-align:center;color:var(--ed-muted);font-size:12px;}
.ed-settings-wrap{flex:1;overflow-y:auto;padding:24px 16px;}
.ed-settings-card{background:var(--ed-surf);border:1px solid var(--ed-bdr);border-radius:12px;padding:20px;margin-bottom:16px;}
.ed-settings-card h3{font-size:14px;font-weight:700;color:var(--ed-text);margin:0 0 14px;display:flex;align-items:center;gap:8px;}
.ed-settings-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.ed-settings-row.col1{grid-template-columns:1fr;}.ed-settings-row.col3{grid-template-columns:1fr 1fr 1fr;}
.ed-notif{position:fixed;bottom:20px;right:20px;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:10000;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:none;}
.ed-notif.ok{background:#1b5e20;color:#fff;}.ed-notif.err{background:#b71c1c;color:#fff;}.ed-notif.show{opacity:1;transform:translateY(0);}
.ed-mobile-panel-btn{display:none;position:fixed;bottom:70px;z-index:150;width:44px;height:44px;border-radius:50%;border:none;font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15);}
.ed-mobile-panel-btn.left-btn{left:12px;background:var(--ed-primary);color:#fff;}
.ed-mobile-panel-btn.right-btn{right:12px;background:var(--ed-surf);color:var(--ed-primary);border:1px solid var(--ed-bdr);}
/* Upload zone */
.ed-upload-zone{border:2px dashed var(--ed-bdr);border-radius:8px;padding:16px;text-align:center;cursor:pointer;transition:all .15s;margin-bottom:10px;background:#fafbfc;}
.ed-upload-zone:hover,.ed-upload-zone.drag-over{border-color:var(--ed-primary);background:var(--ed-primary-lt);}
.ed-upload-zone .uz-icon{font-size:28px;margin-bottom:4px;}
.ed-upload-zone .uz-text{font-size:11px;color:var(--ed-muted);}
.ed-upload-zone .uz-hint{font-size:10px;color:#aaa;margin-top:2px;}
.ed-upload-preview{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--ed-bdr);border-radius:6px;margin-bottom:8px;background:#fafbfc;}
.ed-upload-preview img{width:48px;height:48px;object-fit:contain;border-radius:4px;background:#fff;border:1px solid var(--ed-bdr);}
.ed-upload-preview .up-info{flex:1;min-width:0;font-size:11px;color:var(--ed-muted);}
.ed-upload-preview .up-remove{cursor:pointer;font-size:16px;color:#ef4444;padding:4px;}
/* Preset grid */
.ed-preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.ed-preset-btn{padding:8px 6px;border:1px solid var(--ed-bdr);border-radius:6px;background:#fff;font-size:11px;font-weight:500;cursor:pointer;text-align:center;transition:all .12s;display:flex;flex-direction:column;align-items:center;gap:2px;}
.ed-preset-btn:hover{border-color:var(--ed-primary);color:var(--ed-primary);background:var(--ed-primary-lt);}
.ed-preset-btn .pb-icon{font-size:16px;}
@media(max-width:899px){
  .ed-sidebar,.ed-props{position:fixed;top:0;bottom:0;width:85vw;max-width:320px;z-index:300;transform:translateX(-110%);transition:transform .22s ease;box-shadow:4px 0 20px rgba(0,0,0,.15);}
  .ed-props{right:0;left:auto;transform:translateX(110%);}
  .ed-sidebar.mobile-show{transform:translateX(0);}.ed-props.mobile-show{transform:translateX(0);}
  .ed-mobile-panel-btn{display:flex;align-items:center;justify-content:center;}
  .ed-canvas-wrap{padding:12px;}.ed-topbar-back span{display:none;}
  .ed-mode-tabs{padding:0 8px;overflow-x:auto;}.ed-mode-tab{padding:9px 12px;font-size:12px;white-space:nowrap;}
}
@media(max-width:599px){.ed-settings-row{grid-template-columns:1fr !important;}.ed-settings-wrap{padding:12px;}.ed-settings-card{padding:14px;}}
</style>

<body>
<div class="ed-app">

</div>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════

// ── Auth ─────────────────────────────────────────────────
function logout(){['token','type','role','slug','user_id','email','tenant_token'].forEach(k=>{localStorage.removeItem(k);sessionStorage.removeItem(k);});window.location.replace('/tenant-login.html');}
const HOST='';
function getH(){const t=localStorage.getItem('token')||'';return{'Content-Type':'application/json','Authorization':'Bearer '+t};}
function getHMultipart(){const t=localStorage.getItem('token')||'';return{'Authorization':'Bearer '+t};}
function handleAuthErr(s){if(s===401)logout();}
function notif(msg,type='ok'){const el=document.getElementById('edNotif');el.textContent=msg;el.className='ed-notif '+type+' show';setTimeout(()=>el.classList.remove('show'),3000);}

// ═══ STATE ═══
let tenantSettings = {};
let currentMode = 'settings';
let zoomPct = 100;
let selectedElId = null;
let isDragging = false;
let isResizing = false;
let dragOffset = {x:0,y:0};

const MAX_IMG_KB = 512;
const ALLOWED_IMG_TYPES = ['image/jpeg','image/png'];
const ALLOWED_IMG_EXT = ['.jpg','.jpeg','.png'];

// ═══ DEFAULT LABEL TEMPLATE — matches actual label_pdf.py layout ═══

    { id:'divider2', type:'line', label:'Address Divider', x:14, y:234, w:356, h:1, color:'#dddddd', lineStyle:'dashed', visible:true },

async function loadTenantSettings(){
  try{
    const r = await fetch(HOST+'/api/tenant/settings',{headers:getH()});
    if(!r.ok){handleAuthErr(r.status);return;}
    tenantSettings = await r.json();
    if(tenantSettings.label_template) labelTemplate = tenantSettings.label_template;
    if(tenantSettings.invoice_template) invoiceTemplate = tenantSettings.invoice_template;
  }catch(e){console.error(e);}
}

function switchMode(mode){
  currentMode = mode;
  document.querySelectorAll('.ed-mode-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('mode-'+mode).classList.add('active');
  document.getElementById('view-settings').style.display = mode==='settings' ? '' : 'none';
  document.getElementById('view-editor').style.display = mode!=='settings' ? 'flex' : 'none';
  const mSb=document.getElementById('mobileSidebarBtn'),mPb=document.getElementById('mobilePropsBtn');
  if(mode==='settings'){if(mSb)mSb.style.display='none';if(mPb)mPb.style.display='none';}
  if(mode!=='settings'){selectedElId=null;renderEditor();updateMobileButtons();}
}
function updateMobileButtons(){
  const isMobile=window.innerWidth<=899,isEditor=currentMode!=='settings';

  if(mSb)mSb.style.display=(isMobile&&isEditor)?'flex':'none';

function renderLogoUpload(){
  const area = document.getElementById('logoUploadArea');
  if(!area) return;
  const currentLogo = tenantSettings.logo_url || '';
  if(currentLogo){
    area.innerHTML = `
      <div class="ed-upload-preview">
        <img src="${esc(currentLogo)}" alt="Logo">
        <div class="up-info"><div style="font-weight:600;">Current Logo</div><div>Click ✕ to remove</div></div>
        <span class="up-remove" onclick="removeLogo()" title="Remove logo">✕</span>
      </div>
      <button class="ed-add-btn" onclick="document.getElementById('logoFileInput').click()">📷 Change Logo</button>
      <input type="file" id="logoFileInput" accept=".jpg,.jpeg,.png" style="display:none" onchange="handleLogoUpload(this)">`;
  } else {
    area.innerHTML = `
      <div class="ed-upload-zone" onclick="document.getElementById('logoFileInput').click()" id="logoDropZone">
        <div class="uz-icon">📷</div>
        <div class="uz-text">Click to upload logo</div>
        <div class="uz-hint">JPG or PNG only, max ${MAX_IMG_KB} KB</div>
      </div>
      <input type="file" id="logoFileInput" accept=".jpg,.jpeg,.png" style="display:none" onchange="handleLogoUpload(this)">`;
    // Drag-drop on the zone
    const zone = document.getElementById('logoDropZone');
    if(zone){
      zone.addEventListener('dragover', e=>{e.preventDefault();zone.classList.add('drag-over');});
      zone.addEventListener('dragleave', ()=>zone.classList.remove('drag-over'));
      zone.addEventListener('drop', e=>{e.preventDefault();zone.classList.remove('drag-over');if(e.dataTransfer.files.length)uploadImageFile(e.dataTransfer.files[0],'logo');});
    }
  }
}

function removeLogo(){
  tenantSettings.logo_url = '';
  renderLogoUpload();
}

async function handleLogoUpload(input){
  if(!input.files||!input.files.length) return;
  await uploadImageFile(input.files[0], 'logo');
}

async function uploadImageFile(file, imageType){
  // Client-side validation
  if(!ALLOWED_IMG_TYPES.includes(file.type)){
    notif('Only JPG/PNG images are allowed!','err'); return;
  }
  const ext = '.'+file.name.split('.').pop().toLowerCase();
  if(!ALLOWED_IMG_EXT.includes(ext)){
    notif('Only .jpg / .png files are allowed!','err'); return;
  }
  if(file.size > MAX_IMG_KB * 1024){
    notif(`Image too large (${(file.size/1024).toFixed(0)} KB). Max ${MAX_IMG_KB} KB.`,'err'); return;
  }
  // Upload to server
  const fd = new FormData();
  fd.append('file', file);
  fd.append('image_type', imageType);
  try{
    const r = await fetch(HOST+'/api/tenant/upload-image', {method:'POST', headers:getHMultipart(), body:fd});
    if(!r.ok){const e=await r.json();notif(e.detail||'Upload failed','err');return;}
    const data = await r.json();
    notif(`✅ ${imageType} image uploaded (${data.size_kb} KB)`,'ok');
    if(imageType==='logo'){
      tenantSettings.logo_url = data.url;
      renderLogoUpload();
    }
    return data.url;
  }catch(e){notif('Upload failed: '+e.message,'err');}
  return null;
}

async function saveSettings(){
  const payload = {};
  const fields = ['company_name','phone','email','slogan','address_line1','address_line2','gst_city','gst_state','gst_pincode','gstin','gst_address','bank_name','bank_account','bank_ifsc','bank_branch','upi_id','invoice_prefix','proforma_prefix','bill_prefix','label_footer_note'];
  fields.forEach(f=>{const el=document.getElementById('ts_'+f);if(el)payload[f]=el.value||null;});
  ['label_show_logo','label_show_slogan','label_show_barcode'].forEach(f=>{const el=document.getElementById('ts_'+f);if(el)payload[f]=el.checked;});
  // Include logo_url from state
  payload.logo_url = tenantSettings.logo_url || null;
  try{
    const r=await fetch(HOST+'/api/tenant/settings',{method:'PATCH',headers:getH(),body:JSON.stringify(payload)});
    if(r.ok){tenantSettings=await r.json();notif('✅ Settings saved','ok');}
    else{const e=await r.json();notif(e.detail||'Save failed','err');}
  }catch(e){notif('Network error','err');}
}

async function handleEditorImageUpload(input, type){
  if(!input.files||!input.files.length)return;
  await handleEditorImageFile(input.files[0], type);
}

async function handleEditorImageFile(file, type){
  // Client validation
  if(!ALLOWED_IMG_TYPES.includes(file.type)){notif('Only JPG/PNG allowed!','err');return;}
  if(file.size > MAX_IMG_KB * 1024){notif(`Image too large (${(file.size/1024).toFixed(0)}KB). Max ${MAX_IMG_KB}KB.`,'err');return;}
  // Upload
  const url = await uploadImageFile(file, type);
  if(!url) return;
  // Apply to the right element
  const tmpl = getActiveTemplate();
  const targetId = type==='header' ? 'inv_header_img' : 'inv_footer_img';
  let el = tmpl.elements.find(e=>e.id===targetId);
  if(el){
    el.src = url;
    el.visible = true;
    if(type==='header') el.h = 60;
    if(type==='footer') el.h = 40;
  }
  renderEditor();
}

function renderCanvas(){
  const tmpl=getActiveTemplate();

  const scale=zoomPct/100;
  canvas.style.width=(tmpl.canvas.width*scale)+'px';
  canvas.style.height=(tmpl.canvas.height*scale)+'px';
  canvas.style.background=tmpl.canvas.bgColor||'#fff';
  document.getElementById('zoomLevel').textContent=zoomPct+'%';
  const wIn=(tmpl.canvas.width/96).toFixed(1), hIn=(tmpl.canvas.height/96).toFixed(1);
  document.getElementById('canvasSizeLabel').textContent=`${wIn}″ × ${hIn}″`;

  let html='';
  tmpl.elements.forEach(el=>{
    if(el.visible===false) return;
    const sx=el.x*scale, sy=el.y*scale, sw=el.w*scale, sh=el.h*scale;
    const sel=selectedElId===el.id;

    if(el.type==='line'){

      html+=`<div class="ed-el ${sel?'selected':''}" data-id="${el.id}" style="left:${sx}px;top:${sy}px;width:${sw}px;height:${Math.max(sh,4)}px;display:flex;align-items:center;"

async function handlePropImageUpload(input, elId){
  if(!input.files||!input.files.length)return;
  const file=input.files[0];
  if(!ALLOWED_IMG_TYPES.includes(file.type)){notif('Only JPG/PNG allowed!','err');return;}

  const url=await uploadImageFile(file,'logo');
  if(url){elProp(elId,'src',url);}
}


// ── ELEMENT OPERATIONS ──

function selectElement(id){selectedElId=id;renderCanvas();renderProps();renderSidebar();}
function deselectAll(){selectedElId=null;renderCanvas();renderProps();renderSidebar();}

function tmplProp(section,key,val){
  const t=getActiveTemplate();
  if(val!==undefined){if(!t[section])t[section]={};t[section][key]=val;}
  else{t[section]=key;}
  setActiveTemplate(t);renderCanvas();
}
function elProp(elId,key,val){
  const t=getActiveTemplate();
  const el=t.elements.find(e=>e.id===elId);
  if(el){el[key]=val;setActiveTemplate(t);renderCanvas();renderProps();}
}
function toggleVis(elId){
  const t=getActiveTemplate();
  const el=t.elements.find(e=>e.id===elId);
  if(el){el.visible=el.visible===false?true:false;setActiveTemplate(t);renderCanvas();renderSidebar();}
}
function deleteElement(elId){
  pushUndo();
  const t=getActiveTemplate();
  t.elements=t.elements.filter(e=>e.id!==elId);
  if(selectedElId===elId)selectedElId=null;
  setActiveTemplate(t);renderCanvas();renderSidebar();renderProps();
}
function addElement(type){
  pushUndo();
  const t=getActiveTemplate();const id='el_'+Date.now();

// Element list reorder via drag
let dragListSrcId=null;
function onElListDragStart(e,elId){dragListSrcId=elId;e.dataTransfer.effectAllowed='move';}
function onElListDragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';}
function onElListDrop(e,targetId){
  e.preventDefault();if(!dragListSrcId||dragListSrcId===targetId)return;
  const t=getActiveTemplate();const elems=t.elements;
  const srcI=elems.findIndex(x=>x.id===dragListSrcId);
  const tgtI=elems.findIndex(x=>x.id===targetId);
  if(srcI<0||tgtI<0)return;
  const [moved]=elems.splice(srcI,1);elems.splice(tgtI,0,moved);
  setActiveTemplate(t);renderSidebar();renderCanvas();
  dragListSrcId=null;
}


// ── SMOOTH DRAG & DROP (requestAnimationFrame) — optimized ──
let dragging=false,dragElId=null,dragStartX=0,dragStartY=0,dragElStartX=0,dragElStartY=0,rafId=null;
let resizing=false,resElId=null,resStartX=0,resStartY=0,resElStartW=0,resElStartH=0;
let pendingDragX=0,pendingDragY=0,pendingResW=0,pendingResH=0;
let _boundMoveH=null,_boundUpH=null; // proper cleanup references
let _justDragged=false; // prevent deselect on drag end

function getCanvasCoords(e){
  const cv=document.getElementById('edCanvas');if(!cv)return{cx:0,cy:0};
  const r=cv.getBoundingClientRect();
  const scale=zoomPct/100;
  const touch=e.touches?e.touches[0]:e;
  return{cx:(touch.clientX-r.left)/scale, cy:(touch.clientY-r.top)/scale};
}

// Fast DOM update: only move the single dragged element instead of full re-render
function _fastMoveEl(elId,x,y){
  const dom=document.querySelector(`.ed-el[data-id="${elId}"]`);
  if(!dom)return;
  const scale=zoomPct/100;
  dom.style.left=(x*scale)+'px';
  dom.style.top=(y*scale)+'px';
}
function _fastResizeEl(elId,w,h){
  const dom=document.querySelector(`.ed-el[data-id="${elId}"]`);
  if(!dom)return;
  const scale=zoomPct/100;
  dom.style.width=(w*scale)+'px';
  const el_type=getActiveTemplate().elements.find(x=>x.id===elId);
  if(el_type && el_type.type==='text') dom.style.minHeight=(h*scale)+'px';
  else dom.style.height=(h*scale)+'px';
}

function startDrag(e,elId){
  e.preventDefault();e.stopPropagation();
  pushUndo();
  if(selectedElId!==elId) selectElement(elId);
  const t=getActiveTemplate();const el=t.elements.find(x=>x.id===elId);if(!el)return;
  const {cx,cy}=getCanvasCoords(e);
  dragging=true;dragElId=elId;_justDragged=false;
  dragStartX=cx;dragStartY=cy;
  dragElStartX=el.x;dragElStartY=el.y;
  pendingDragX=el.x;pendingDragY=el.y;

  const isTouch=e.type==='touchstart';
  _boundMoveH=isTouch?(ev)=>{ev.preventDefault();updateDrag(ev);}:(ev)=>{ev.preventDefault();updateDrag(ev);};
  _boundUpH=()=>finishDrag();
  document.addEventListener(isTouch?'touchmove':'mousemove',_boundMoveH,{passive:false});
  document.addEventListener(isTouch?'touchend':'mouseup',_boundUpH,{once:true});
}

function updateDrag(e){
  const {cx,cy}=getCanvasCoords(e);
  pendingDragX=Math.round(dragElStartX+(cx-dragStartX));
  pendingDragY=Math.round(dragElStartY+(cy-dragStartY));
  _justDragged=true;
  if(!rafId)rafId=requestAnimationFrame(applyDragFrame);
}

function applyDragFrame(){
  rafId=null;
  if(!dragging)return;
  const t=getActiveTemplate();const el=t.elements.find(x=>x.id===dragElId);
  if(!el)return;
  const maxX=(t.canvas.width||384)-el.w; const maxY=(t.canvas.height||576)-el.h;
  el.x=Math.max(0,Math.min(pendingDragX,maxX));
  el.y=Math.max(0,Math.min(pendingDragY,maxY));
  setActiveTemplate(t);
  // Fast update — avoid full re-render for smooth dragging
  _fastMoveEl(dragElId, el.x, el.y);
}

function finishDrag(){
  dragging=false;
  document.removeEventListener('mousemove',_boundMoveH);
  document.removeEventListener('touchmove',_boundMoveH);
  if(rafId){cancelAnimationFrame(rafId);rafId=null;}
  _boundMoveH=null;_boundUpH=null;
  renderCanvas(); // final clean render
  renderProps();
  // Prevent click-deselect right after dragging
  if(_justDragged){setTimeout(()=>{_justDragged=false;},50);}
}

// ── RESIZE ──
function startResize(e,elId){
  e.preventDefault();e.stopPropagation();
  pushUndo();
  const t=getActiveTemplate();const el=t.elements.find(x=>x.id===elId);if(!el)return;
  const {cx,cy}=getCanvasCoords(e);
  resizing=true;resElId=elId;_justDragged=false;
  resStartX=cx;resStartY=cy;
  resElStartW=el.w;resElStartH=el.h;
  pendingResW=el.w;pendingResH=el.h;

  const isTouch=e.type==='touchstart';
  _boundMoveH=isTouch?(ev)=>{ev.preventDefault();updateResize(ev);}:(ev)=>{ev.preventDefault();updateResize(ev);};
  _boundUpH=()=>finishResize();
  document.addEventListener(isTouch?'touchmove':'mousemove',_boundMoveH,{passive:false});
  document.addEventListener(isTouch?'touchend':'mouseup',_boundUpH,{once:true});
}
function updateResize(e){
  const {cx,cy}=getCanvasCoords(e);
  pendingResW=Math.max(10,Math.round(resElStartW+(cx-resStartX)));
  pendingResH=Math.max(4,Math.round(resElStartH+(cy-resStartY)));
  _justDragged=true;
  if(!rafId)rafId=requestAnimationFrame(applyResizeFrame);
}
function applyResizeFrame(){
  rafId=null;if(!resizing)return;
  const t=getActiveTemplate();const el=t.elements.find(x=>x.id===resElId);if(!el)return;
  el.w=pendingResW;el.h=pendingResH;
  setActiveTemplate(t);
  _fastResizeEl(resElId, el.w, el.h);
}
function finishResize(){
  resizing=false;
  document.removeEventListener('mousemove',_boundMoveH);
  document.removeEventListener('touchmove',_boundMoveH);
  if(rafId){cancelAnimationFrame(rafId);rafId=null;}
  _boundMoveH=null;_boundUpH=null;
  renderCanvas();
  renderProps();
  if(_justDragged){setTimeout(()=>{_justDragged=false;},50);}
}

// Canvas click deselect — ignore if we just dragged
function onCanvasClick(e){
  if(_justDragged) return;
  if(e.target.id==='edCanvas'||e.target.classList.contains('ed-canvas')){deselectAll();}
}


// ── ZOOM ──
function doZoom(delta){
  if(delta===0){zoomPct=100;}
  else{zoomPct=Math.max(30,Math.min(300,zoomPct+delta));}
  renderCanvas();
}

// ── SAVE / RESET ──
async function saveAll(){
  try{
    const h=getH();
    // Save label template
    const r1 = await fetch('/api/tenant/label-template',{method:'PATCH',headers:h,body:JSON.stringify({template: labelTemplate})});
    if(!r1.ok){const e=await r1.json().catch(()=>({}));notif('Label save failed: '+(e.detail||r1.status),'err');return;}
    // Save invoice template
    const r2 = await fetch('/api/tenant/invoice-template',{method:'PATCH',headers:h,body:JSON.stringify({template: invoiceTemplate})});
    if(!r2.ok){const e=await r2.json().catch(()=>({}));notif('Invoice save failed: '+(e.detail||r2.status),'err');return;}
    notif('Templates saved!');
  }catch(err){notif('Save failed: '+err.message,'err');}
}

function resetTemplate(){
  if(!confirm('Reset '+currentMode+' template to defaults? This cannot be undone.'))return;
  if(currentMode==='label'){labelTemplate=JSON.parse(JSON.stringify(DEFAULT_LABEL_TEMPLATE));}
  else{invoiceTemplate=JSON.parse(JSON.stringify(DEFAULT_INVOICE_TEMPLATE));}
  selectedElId=null;renderEditor();notif('Template reset to defaults');
}

// ── UNDO / REDO ──
function pushUndo(){
  const t=getActiveTemplate();
  undoStack.push(JSON.stringify(t));
  if(undoStack.length>MAX_UNDO) undoStack.shift();
  redoStack=[];
}
function undo(){
  if(!undoStack.length)return;
  const t=getActiveTemplate();
  redoStack.push(JSON.stringify(t));
  const prev=JSON.parse(undoStack.pop());
  setActiveTemplate(prev);selectedElId=null;
  renderEditor();notif('↩ Undo');
}
function redo(){
  if(!redoStack.length)return;
  const t=getActiveTemplate();
  undoStack.push(JSON.stringify(t));
  const next=JSON.parse(redoStack.pop());
  setActiveTemplate(next);selectedElId=null;
  renderEditor();notif('↪ Redo');
}
// Duplicate selected element
function duplicateSelected(){
  if(!selectedElId)return;
  const t=getActiveTemplate();
  const el=t.elements.find(e=>e.id===selectedElId);
  if(!el)return;
  pushUndo();
  const clone=JSON.parse(JSON.stringify(el));
  clone.id='el_'+Date.now();
  clone.label=(el.label||'Element')+' copy';
  clone.x=Math.min(el.x+15, (t.canvas.width||384)-clone.w);
  clone.y=Math.min(el.y+15, (t.canvas.height||576)-clone.h);
  t.elements.push(clone);
  selectedElId=clone.id;
  setActiveTemplate(t);renderEditor();
  notif('Duplicated: '+clone.label);
}

// ── KEYBOARD SHORTCUTS ──
document.addEventListener('keydown',function(e){
  // Global shortcuts: Ctrl+Z (undo), Ctrl+Shift+Z / Ctrl+Y (redo)
  if((e.ctrlKey||e.metaKey) && e.key==='z' && !e.shiftKey){e.preventDefault();undo();return;}
  if((e.ctrlKey||e.metaKey) && (e.key==='y' || (e.key==='z'&&e.shiftKey))){e.preventDefault();redo();return;}
  if((e.ctrlKey||e.metaKey) && e.key==='d' && selectedElId){e.preventDefault();duplicateSelected();return;}

  if(!selectedElId)return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  const step=e.shiftKey?10:1;
  const t=getActiveTemplate();const el=t.elements.find(x=>x.id===selectedElId);if(!el)return;
  let handled=false;
  switch(e.key){
    case 'ArrowLeft':el.x=Math.max(0,el.x-step);handled=true;break;
    case 'ArrowRight':el.x=Math.min((t.canvas.width||384)-el.w,el.x+step);handled=true;break;
    case 'ArrowUp':el.y=Math.max(0,el.y-step);handled=true;break;
    case 'ArrowDown':el.y=Math.min((t.canvas.height||576)-el.h,el.y+step);handled=true;break;
    case 'Delete':case 'Backspace':deleteElement(selectedElId);handled=true;break;
    case 'Escape':deselectAll();handled=true;break;
  }
  if(handled){e.preventDefault();setActiveTemplate(t);renderCanvas();renderProps();}
});

// ── UTILITY ──
function esc(s){if(!s)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
