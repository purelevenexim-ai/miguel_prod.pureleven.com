<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="/miguel_favicon.png?v=2">
<link rel="shortcut icon" type="image/png" href="/miguel_favicon.png?v=2">
<link rel="apple-touch-icon" href="/miguel_favicon.png?v=2">
<title>Platform Admin — Miguel</title>
<link rel="stylesheet" href="/ds.css">
<link rel="stylesheet" href="/styles/adaptive.css?v=20260307">
<link rel="stylesheet" href="/styles/mobile.css?v=20260307">
<script defer src="/modules/adaptive-layout.js?v=20260307"></script>
<style>
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-page);
}
.login-card {
  background: var(--surf);
  border: 1px solid var(--bdr);
  border-radius: var(--r-md);
  padding: 40px 40px 36px;
  width: 100%;
  max-width: 400px;
  
}
.login-logo {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 28px;
}
.login-logo-icon {
  width: 40px;
  height: 40px;
  background: var(--md-sys-color-primary);
  border-radius: var(--r-md);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 18px;
  font-weight: 700;
  font-family: var(--font);
  flex-shrink: 0;
}
.login-logo-name { font-size: 18px; font-weight: 600; color: var(--g-900); font-family: var(--font); }
.login-logo-sub  { font-size: 11px; color: var(--g-600); letter-spacing: .04em; font-family: var(--font); text-transform: uppercase; }
h1 { font-size: 20px; font-weight: 600; color: var(--g-900); margin-bottom: 6px; font-family: var(--font); }
.login-subtitle { font-size: 13px; color: var(--g-700); margin-bottom: 28px; font-family: var(--font); }
.badge { font-size: 12px; color: var(--g-600); text-align: center; margin-top: 20px; font-family: var(--font); }
</style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">
    <div class="login-logo-icon" style="background:none;padding:0;overflow:hidden;"><img src="/miguel_favicon.png" alt="Miguel" style="width:40px;height:40px;display:block;"></div>
    <div>
      <div class="login-logo-name">Miguel</div>
      <div class="login-logo-sub">Platform Admin</div>
    </div>
  </div>

  <h1>Sign in to continue</h1>
  <p class="login-subtitle">SuperAdmin access only. Tenant login is on a separate page.</p>

  <div class="gs-banner gs-banner-error" id="err" style="display:none;margin-bottom:16px;"></div>

  <form id="loginForm">
    <div class="form-group">
      <label class="form-label" for="email">Email address</label>
      <input type="email" class="form-input" id="email"
        placeholder="admin@example.com" required autofocus>
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input type="password" class="form-input" id="password"
        placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn btn-filled" id="btn"
      style="width:100%;height:40px;font-size:14px;margin-top:4px;">
      Sign in
    </button>
  </form>

  <div class="badge">🔒 Platform domain — not for tenant users</div>
</div>

<script>
if (localStorage.getItem('type') === 'platform' && localStorage.getItem('token')) {
  window.location.replace('/platform-admin.html');
}

const form   = document.getElementById('loginForm');
const errBox = document.getElementById('err');
const btn    = document.getElementById('btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errBox.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Signing in…';

  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const body     = new URLSearchParams({ username: email, password });

  try {
    const res = await fetch('/platform/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body.toString(),
    });

    if (res.ok) {
      const data = await res.json();
      localStorage.setItem('token', data.access_token);
      localStorage.setItem('type', 'platform');
      localStorage.setItem('role', data.role || 'superadmin');
      window.location.replace('/platform-admin.html');
    } else {
      const err = await res.json().catch(() => ({}));
      showErr(err.detail || 'Login failed — check your credentials.');
    }
  } catch (ex) {
    showErr('Cannot reach server. Is the backend running?');
  }
});

function showErr(msg) {
  errBox.textContent   = msg;
  errBox.style.display = '';
  btn.disabled         = false;
  btn.textContent      = 'Sign in';
}
</script>
</body>
</html>
