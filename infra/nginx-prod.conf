user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # ── Redirect HTTP → HTTPS ───────────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name prod.pureleven.com;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS Server ────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name prod.pureleven.com;

        ssl_certificate     /etc/letsencrypt/live/prod.pureleven.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/prod.pureleven.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        root /usr/share/nginx/html;
        index tenant-login.html;

        # ── Docker DNS resolver ────────────────────────────────
        # 127.0.0.11 is Docker's embedded DNS server.
        # Using a variable ($backend) forces nginx to resolve the
        # hostname at REQUEST time, not at startup. This prevents
        # nginx from crashing if the backend container restarts,
        # changes IP, or isn't ready yet.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://pureleven_backend:8000;

        # ── Serve all static HTML/CSS/JS files directly ──────��─
        location / {
            try_files $uri $uri/ =404;
        }

        # ── Proxy API requests to backend ──────────────────────
        location /api/ {
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect http:// https://;
        }

        # ── Tenant auth & API endpoints ─────────────────────────
        location /tenant/ {
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect http:// https://;
        }

        # ── Platform auth & API endpoints ──────────────────────
        location /platform/ {
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect http:// https://;
        }

        # ── HTML pages — never cache (always serve fresh) ──────
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri =404;
        }

        # ── Static assets — long cache with versioned URLs ──────
        # CSS/JS use ?v=YYYYMMDD query strings so cache-bust is safe
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
    }
}
